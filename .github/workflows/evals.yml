# Eval gate: unit tests + the deterministic eval suite must pass for a change to merge.
# The LLM-judge suite runs too, but only when a hosted judge key is configured;
# otherwise the report says "LLM-judge: not run (no key)".
name: evals

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  TORCH_VERSION: "2.15.0"
  OLLAMA_MODEL: llama3.2:3b
  HF_HUB_DISABLE_TELEMETRY: "1"
  DEEPEVAL_TELEMETRY_OPT_OUT: "YES"

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies (CPU-only torch first)
        run: |
          pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-v1

      - name: Build retrieval index
        run: python -m evals.build_index --check

      - name: Run unit tests
        env:
          HF_HUB_OFFLINE: "1"
        run: pytest

  evals:
    name: Eval suites
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLM_PROVIDER: ollama
      LLM_MODEL: llama3.2:3b
      LLM_TEMPERATURE: "0"
      LLM_SEED: "42"
      # Optional judge: set repository variables JUDGE_PROVIDER / JUDGE_MODEL and the
      # matching secret. Unset or keyless -> the judge suite reports "not run (no key)".
      JUDGE_PROVIDER: ${{ vars.JUDGE_PROVIDER }}
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
      JUDGE_THRESHOLD: ${{ vars.JUDGE_THRESHOLD || '0.7' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies (CPU-only torch first)
        run: |
          pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-v1

      - name: Cache Ollama model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.OLLAMA_MODEL }}-v1

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # The installer's systemd service runs as another user; serve from ~/.ollama instead.
          sudo systemctl stop ollama 2>/dev/null || true
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:11434/api/version && break; sleep 1; done
          ollama pull "$OLLAMA_MODEL"

      - name: Build retrieval index
        run: python -m evals.build_index --check

      - name: Run eval suites (gate)
        env:
          HF_HUB_OFFLINE: "1"
        run: python -m evals.run --suite all

      - name: Publish report to job summary
        if: always()
        run: |
          if [ -f eval-report.md ]; then cat eval-report.md >> "$GITHUB_STEP_SUMMARY"; else echo "No report was written." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            eval-report.md
            eval-results.json
          if-no-files-found: warn
